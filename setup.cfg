# flake8 has no pyproject.toml support, so its configuration lives here.
[flake8]
max-line-length = 100
extend-ignore =
    # Formatting is black's job; E203 conflicts with it.
    E203,
    # `from .base import *` is the documented Django settings idiom.
    F403,
    F405
exclude =
    .git,
    .venv,
    __pycache__,
    */migrations/*,
    staticfiles,
    project_venv
per-file-ignores =
    config/settings/*.py: F401
