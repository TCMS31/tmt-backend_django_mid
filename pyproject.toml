[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  | migrations
  | \.venv
  | staticfiles
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:interview.*"]
